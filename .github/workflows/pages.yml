name: test-and-deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e ".[test]"
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('tools/vendor.lock.json', 'tools/fetch_vendor.py') }}
      - name: Fetch the libraries the site serves itself (checked against tools/vendor.lock.json)
        run: python3 tools/fetch_vendor.py
      - run: nproc
      - run: pytest -q -n auto
        env:
          OMP_NUM_THREADS: "1"          # numpy/scipy would otherwise start one thread per core in every test worker
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('tools/vendor.lock.json', 'tools/fetch_vendor.py') }}
      - name: Fetch the libraries the site serves itself (checked against tools/vendor.lock.json)
        run: python3 tools/fetch_vendor.py
      - name: Assemble site
        run: python3 tools/build_site.py site "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
