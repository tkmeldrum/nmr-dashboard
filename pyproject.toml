[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmrdash"
version = "0.0.1"
description = "Kea CPMG NMR processing, runs in the browser (Pyodide) or on the desktop"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "emcee"]
mcmc = ["emcee"]

[tool.setuptools]
packages = ["nmrdash"]
